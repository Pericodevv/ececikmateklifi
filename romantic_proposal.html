<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benimle Çıkar Mısın? 🤍</title>
    <!-- Tailwind CSS for modern responsive utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Playfair Display for romance & Inter for UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #140d1a 0%, #09060d 100%);
            color: #f3f4f6;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .romantic-title {
            font-family: 'Playfair Display', serif;
        }
        /* Glassmorphism card styling */
        .glass-card {
            background: rgba(20, 15, 25, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(236, 72, 153, 0.15);
        }
        /* Neon glow effects */
        .neon-glow-white {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.5), 0 0 30px rgba(255, 255, 255, 0.3);
        }
        .neon-glow-pink {
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.4), inset 0 0 15px rgba(236, 72, 153, 0.2);
        }
        .neon-btn-yes {
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.6);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .neon-btn-yes:hover {
            box-shadow: 0 0 35px rgba(244, 63, 94, 0.9), 0 0 60px rgba(244, 63, 94, 0.5);
            transform: scale(1.05);
        }
        /* Floating background heart animations */
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.5);
                opacity: 0;
            }
            20% {
                opacity: 0.6;
            }
            80% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }
        .floating-heart {
            position: absolute;
            bottom: -10vh;
            color: rgba(244, 63, 94, 0.4);
            animation: floatUp linear infinite;
            pointer-events: none;
        }
        /* Lily modal slide up animation */
        #lilyModal {
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
            transform: translateY(100%);
            opacity: 0;
        }
        #lilyModal.active {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative p-4 selection:bg-pink-500 selection:text-white">

    <!-- Ambient Floating Particles Container -->
    <div id="ambientParticles" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

    <!-- Main Proposal Box -->
    <main id="proposalCard" class="glass-card relative z-10 w-full max-w-md p-8 md:p-10 rounded-3xl text-center flex flex-col items-center transition-all duration-500">
        <!-- Decorative glowing heart icon -->
        <div class="w-16 h-16 mb-6 rounded-full bg-pink-500/10 flex items-center justify-center border border-pink-500/30 neon-glow-pink animate-pulse">
            <svg class="w-8 h-8 text-pink-400" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>

        <h1 class="romantic-title text-3xl md:text-4xl font-semibold mb-3 tracking-wide text-white">
            Benimle Çıkar Mısın?
        </h1>
        <p class="text-gray-400 text-sm md:text-base mb-8 font-light">
            Kalbimin en özel köşesini seninle paylaşmak istiyorum...
        </p>

        <!-- Buttons Container -->
        <div id="buttonContainer" class="relative w-full h-24 flex items-center justify-center gap-6">
            <!-- Yes Button -->
            <button id="yesBtn" onclick="acceptProposal()" class="neon-btn-yes bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-medium px-8 py-3.5 rounded-full text-base md:text-lg transition-transform z-20 flex items-center gap-2">
                <span>Evet! 🤍</span>
            </button>

            <!-- No Button (Dodging element) -->
            <button id="noBtn" class="bg-gray-800/80 hover:bg-gray-700/80 text-gray-300 border border-gray-700 font-medium px-8 py-3.5 rounded-full text-base md:text-lg transition-all z-20 absolute right-4 md:right-8">
                Hayır 🙃
            </button>
        </div>
    </main>

    <!-- Fullscreen Neon Lily Modal -->
    <div id="lilyModal" class="fixed inset-0 z-50 bg-[#09060d]/95 backdrop-blur-xl flex flex-col items-center justify-between p-6 md:p-12 overflow-hidden pointer-events-none">
        
        <!-- Top celebratory text -->
        <div class="text-center mt-6 md:mt-8 z-20 opacity-0 transition-opacity duration-1000 delay-500" id="lilyHeader">
            <span class="inline-block px-4 py-1.5 rounded-full bg-white/10 border border-white/20 text-pink-300 text-xs md:text-sm tracking-widest uppercase mb-3 backdrop-blur-md">
                Sonsuza Dek Birlikte
            </span>
            <h2 class="romantic-title text-3xl md:text-5xl font-bold text-white neon-glow-white mb-2">
                "İyi ki Evet Dedin!"
            </h2>
            <p class="text-pink-200/80 text-sm md:text-base font-light max-w-md mx-auto">
                Bu da kalbimin en saf ve parlak çiçeği, senin için...
            </p>
        </div>

        <!-- Canvas for Realistic Neon Lily Animation & Fireworks/Particles -->
        <div class="absolute inset-0 flex items-center justify-center z-10">
            <canvas id="lilyCanvas" class="w-full h-full max-w-4xl max-h-[75vh]"></canvas>
        </div>

        <!-- Bottom Action / Replay -->
        <div class="z-20 mb-4 opacity-0 transition-opacity duration-1000 delay-1000" id="lilyFooter">
            <button onclick="resetProposal()" class="px-6 py-2.5 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 text-white/90 text-sm tracking-wider transition-all backdrop-blur-md">
                Başa Dön ↺
            </button>
        </div>
    </div>

    <script>
        // Ambient background floating hearts generator
        const ambientContainer = document.getElementById('ambientParticles');
        const heartSymbols = ['🤍', '✨', '🌸', '💖'];
        for (let i = 0; i < 15; i++) {
            const span = document.createElement('span');
            span.className = 'floating-heart';
            span.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            span.style.left = Math.random() * 100 + 'vw';
            span.style.fontSize = (Math.random() * 16 + 12) + 'px';
            span.style.animationDuration = (Math.random() * 6 + 6) + 's';
            span.style.animationDelay = (Math.random() * 5) + 's';
            ambientContainer.appendChild(span);
        }

        // Dodging "Hayır" button implementation (Supports both desktop mouse & mobile touch)
        const noBtn = document.getElementById('noBtn');
        const buttonContainer = document.getElementById('buttonContainer');

        function moveNoButton() {
            // Calculate container bounds
            const containerRect = buttonContainer.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            // Random offset values within safe container bounds
            const maxX = containerRect.width - btnRect.width - 20;
            const maxY = 80; // vertical range

            // Generate random movement
            const randomX = (Math.random() - 0.5) * maxX * 1.4;
            const randomY = (Math.random() - 0.5) * maxY * 1.5;

            noBtn.style.position = 'absolute';
            noBtn.style.transition = 'transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1)';
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // Event listeners for escaping "Hayır" button
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // Accept proposal action -> triggers fullscreen neon lily flower canvas animation
        const lilyModal = document.getElementById('lilyModal');
        const lilyHeader = document.getElementById('lilyHeader');
        const lilyFooter = document.getElementById('lilyFooter');
        const proposalCard = document.getElementById('proposalCard');
        const canvas = document.getElementById('lilyCanvas');
        const ctx = canvas.getContext('2d');

        let animationFrameId;
        let progress = 0;
        let particles = [];

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        function acceptProposal() {
            lilyModal.classList.remove('pointer-events-none');
            lilyModal.classList.add('active');
            proposalCard.style.transform = 'scale(0.9)';
            proposalCard.style.opacity = '0';

            setTimeout(() => {
                lilyHeader.style.opacity = '1';
                lilyFooter.style.opacity = '1';
            }, 300);

            resizeCanvas();
            initCelebrationParticles();
            progress = 0;
            cancelAnimationFrame(animationFrameId);
            animateLilyScene();
        }

        function resetProposal() {
            lilyModal.classList.remove('active');
            lilyModal.classList.add('pointer-events-none');
            lilyHeader.style.opacity = '0';
            lilyFooter.style.opacity = '0';
            proposalCard.style.transform = 'scale(1)';
            proposalCard.style.opacity = '1';
            noBtn.style.transform = 'translate(0, 0)';
            cancelAnimationFrame(animationFrameId);
        }

        // Confetti / Celebration Sparkles
        function initCelebrationParticles() {
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: canvas.width / (2 * window.devicePixelRatio),
                    y: canvas.height / (2 * window.devicePixelRatio),
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6 - 2,
                    size: Math.random() * 3 + 1,
                    color: Math.random() > 0.5 ? '#ffffff' : '#f43f5e',
                    alpha: Math.random() * 0.8 + 0.2
                });
            }
        }

        // Realistic Neon White Lily Flower Renderer using Canvas 2D
        function drawNeonLily(prog) {
            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;
            const centerX = width / 2;
            const centerY = height / 2 + 30;

            ctx.clearRect(0, 0, width, height);

            // Draw celebratory floating sparkle particles
            ctx.save();
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.005;
                if (p.alpha <= 0) p.alpha = 0;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            // Stem growth animation based on progress
            const stemHeight = Math.min(prog * 180, 160);
            ctx.save();
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#10b981';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY + 180);
            ctx.quadraticCurveTo(centerX - 10, centerY + 90, centerX, centerY + 20 - (stemHeight > 160 ? 160 : stemHeight));
            ctx.stroke();

            // Stem leaves
            if (prog > 0.4) {
                ctx.fillStyle = '#059669';
                ctx.beginPath();
                ctx.ellipse(centerX - 25, centerY + 80, 25, 8, -Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(centerX + 25, centerY + 120, 25, 8, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // Lily Bloom Progress (0 to 1)
            const bloom = Math.max(0, Math.min(1, (prog - 0.3) / 0.7));
            const currentScale = bloom * 1.2;

            if (bloom > 0) {
                ctx.save();
                ctx.translate(centerX, centerY - 140);
                ctx.scale(currentScale, currentScale);

                // Glow filter settings for realistic neon aesthetic
                ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
                ctx.shadowBlur = 30;

                // Draw 6 Realistic White Lily Petals radiating outwards with curved graceful tips
                const petalAngles = [0, Math.PI / 3, (2 * Math.PI) / 3, Math.PI, (4 * Math.PI) / 3, (5 * Math.PI) / 3];
                
                petalAngles.forEach((angle, idx) => {
                    ctx.save();
                    ctx.rotate(angle);

                    // Gradient for pearlescent glowing white petal
                    const gradient = ctx.createLinearGradient(0, 0, 0, -110);
                    gradient.addColorStop(0, 'rgba(255, 240, 245, 0.95)');
                    gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.9)');
                    gradient.addColorStop(1, 'rgba(200, 220, 255, 0.7)');

                    ctx.fillStyle = gradient;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 1)';
                    ctx.lineWidth = 2.5;

                    // Petal shape path
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(-35, -30, -45, -110, 0, -145);
                    ctx.bezierCurveTo(45, -110, 35, -30, 0, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // Subtle inner petal texture lines
                    ctx.strokeStyle = 'rgba(236, 72, 153, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, -15);
                    ctx.lineTo(0, -115);
                    ctx.stroke();

                    ctx.restore();
                });

                // Center Pistil and Stamens with glowing neon orange/yellow tips
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 20;
                
                // 6 Stamens with anthers
                for (let i = 0; i < 6; i++) {
                    const stamenAngle = (i * Math.PI) / 3 + 0.2;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    const tipX = Math.cos(stamenAngle) * 35;
                    const tipY = Math.sin(stamenAngle) * 35 - 15;
                    ctx.lineTo(tipX, tipY);
                    ctx.stroke();

                    // Stamen Anther tip
                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.arc(tipX, tipY, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Central Pistil
                ctx.strokeStyle = '#34d399';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -25);
                ctx.stroke();

                ctx.fillStyle = '#10b981';
                ctx.beginPath();
                ctx.arc(0, -27, 3.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        function animateLilyScene() {
            progress += 0.015;
            if (progress > 1.4) progress = 1.4; // hold final state

            drawNeonLily(progress);
            animationFrameId = requestAnimationFrame(animateLilyScene);
        }

        window.addEventListener('resize', () => {
            if (lilyModal.classList.contains('active')) {
                resizeCanvas();
            }
        });
    </script>
</body>
</html>
